name: Build ChillGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404" \
            "platforms;android-33" \
            "build-tools;29.0.3"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleAfatRelease \
            -Dorg.gradle.jvmargs="-Xmx6g" \
            -Dorg.gradle.parallel=true \
            --stacktrace

      - name: Sign APK
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > chillgram.keystore
          $ANDROID_HOME/build-tools/29.0.3/zipalign -v 4 "$APK" aligned.apk
          $ANDROID_HOME/build-tools/29.0.3/apksigner sign \
            --ks chillgram.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out ChillGram-v1.0.apk \
            aligned.apk
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChillGram-APK
          path: ChillGram-v1.0.apk
          retention-days: 30
